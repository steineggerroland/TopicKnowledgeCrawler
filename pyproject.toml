[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tkcrawler"
version = "0.1.0"
description = "TopicKnowledgeCrawler: portable RSS/HTML/podcast crawler steps for infl0 and workflow systems"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12",
  "feedparser>=6.0",
  "requests>=2.32",
  "tldextract>=5.1",
  "trafilatura>=2.0",
  "python-dotenv>=1.0",
  "ollama>=0.4",
  "fuzzywuzzy>=0.18",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
