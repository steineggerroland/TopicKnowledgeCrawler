[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tkcrawler"
version = "0.1.0"
description = "TopicKnowledgeCrawler: portable RSS/HTML/podcast crawler steps for infl0 and workflow systems"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "feedparser>=6.0",
  "requests>=2.32",
  "tldextract>=5.1",
  "trafilatura>=2.0",
  "python-dotenv>=1.0",
  "ollama>=0.4",
  "fuzzywuzzy>=0.18",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",     # pycodestyle errors
  "W",     # pycodestyle warnings
  "F",     # pyflakes
  "I",     # isort
  "UP",    # pyupgrade
  "B",     # flake8-bugbear
  "SIM",   # flake8-simplify
  "LOG",   # flake8-logging
  "G",     # flake8-logging-format
]
ignore = [
  "E501",  # line too long – handled by formatter if enabled later
  "SIM108", # ternary operator – readability preference
  "SIM102", # nested if – sometimes clearer than combined condition
]

[tool.ruff.lint.isort]
known-first-party = ["tkcrawler"]
