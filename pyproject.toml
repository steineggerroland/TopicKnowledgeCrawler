[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tkcrawler"
version = "0.1.0"
description = "TopicKnowledgeCrawler: RSS/HTML crawler (crawler) + n8n/infl0 helpers (tkcrawler)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12",
  "feedparser>=6.0",
  "requests>=2.32",
  "tldextract>=5.1",
  "trafilatura>=2.0",
  "python-dotenv>=1.0",
  "ollama>=0.4",
  "fuzzywuzzy>=0.18",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
